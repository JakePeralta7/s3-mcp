[project]
name = "s3-mcp"
version = "0.1.0"
description = "Generic S3-protocol MCP server (stdio) for any S3-compatible endpoint: RustFS, MinIO, R2, B2, AWS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "boto3>=1.43.96",
    "structlog>=26.1.0",
]

[project.scripts]
s3-mcp = "s3_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
    "structlog>=26.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
venvPath = ".venv"
venv = ".venv"
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
